workflows:
  nightvoice_unsigned_ios:
    name: NIGHTVOICE - unsigned IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen and generate project
        script: |
          set -e
          brew install xcodegen || brew upgrade xcodegen
          xcodegen generate --spec project.yml
      - name: Compile iPhone app without signing
        script: |
          set -e
          xcodebuild -project NIGHTVOICE.xcodeproj -scheme NIGHTVOICE -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$CM_BUILD_DIR/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA for Sideloadly
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NIGHTVOICE.app Payload/
          zip -qry NIGHTVOICE-unsigned.ipa Payload
    artifacts:
      - NIGHTVOICE-unsigned.ipa
